<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentCam | Tambah Penyewa</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>RentCam</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../alat/list.html">Daftar Alat</a></li>
                <li><a href="../alat/tambah.html">Tambah Alat</a></li>
                <li><a href="list.html">Daftar Penyewa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Data Penyewa</h2>
            <form action="list.html" method="GET">
                <p>
                    <label for="id_penyewa">ID Penyewa</label>
                    <input type="text" id="id_penyewa" name="id_penyewa" placeholder="Contoh: CUST-004" required>
                </p>

                <p>
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama penyewa" required>
                </p>

                <p>
                    <label for="telepon">No. WhatsApp / HP</label>
                    <input type="tel" id="telepon" name="telepon" placeholder="Contoh: 08123456789" required>
                </p>

                <div class="form-actions">
                    <button type="submit">Simpan</button>
                    <button type="reset" class="btn-reset">Batal</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 RentCam &mdash; Jobsheet 3 Pemrograman Web</p>
    </footer>
</body>
</html>
